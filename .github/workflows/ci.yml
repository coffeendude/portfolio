name: CI

on:
  push:
    branches: [ main, 'overhaul/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run secret checks
        run: bash ./scripts/check-secrets.sh
      - name: Build
        run: npm run build
